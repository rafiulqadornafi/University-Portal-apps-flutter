name: smart_student_portal
description: "Smart University Portal - AIUB"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/university_portal.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/university_portal.png"

  min_sdk_android: 21